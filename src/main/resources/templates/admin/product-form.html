<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p><a href="/admin/products">← К товарам</a></p>
    <h1 th:text="${product != null} ? 'Редактирование' : 'Новый товар'"></h1>
    <form th:action="${product != null} ? @{/admin/products/{id}(id=${product.id})} : @{/admin/products}" method="post">
        <label>Категория
            <select name="categoryId" required>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${product != null and product.category.id == category.id}"></option>
            </select>
        </label>
        <label>Название
            <input name="name" required th:value="${product?.name}">
        </label>
        <label>SKU
            <input name="sku" required th:value="${product?.sku}">
        </label>
        <label>Описание
            <textarea name="description" rows="4" th:text="${product?.description}"></textarea>
        </label>
        <label>Цена
            <input type="number" step="0.01" min="0" name="price" required th:value="${product?.price}">
        </label>
        <label>Остаток
            <input type="number" min="0" name="stock" required th:value="${product != null} ? ${product.stock} : 0">
        </label>
        <label class="check">
            <input type="checkbox" name="active" value="true" th:checked="${product == null or product.active}">
            Активен
        </label>
        <button type="submit">Сохранить</button>
    </form>
</main>
</body>
</html>
