<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="container narrow">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <p><a class="back" href="/admin/products">← К товарам</a></p>
        <form class="panel" th:action="${product != null} ? @{/admin/products/{id}(id=${product.id})} : @{/admin/products}" method="post">
            <h1 th:text="${product != null} ? 'Редактирование' : 'Новый товар'"></h1>
            <label class="field">Категория
                <select name="categoryId" required>
                    <option th:each="category : ${categories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${product != null and product.category.id == category.id}"></option>
                </select>
            </label>
            <label class="field">Название
                <input name="name" required th:value="${product?.name}">
            </label>
            <label class="field">SKU
                <input name="sku" required th:value="${product?.sku}">
            </label>
            <label class="field">Описание
                <textarea name="description" rows="4" th:text="${product?.description}"></textarea>
            </label>
            <div class="grid-2">
                <label class="field">Цена
                    <input type="number" step="0.01" min="0" name="price" required th:value="${product?.price}">
                </label>
                <label class="field">Остаток
                    <input type="number" min="0" name="stock" required th:value="${product != null ? product.stock : 0}">
                </label>
            </div>
            <label class="field check">
                <input type="checkbox" name="active" value="true" th:checked="${product == null or product.active}">
                Активен в каталоге
            </label>
            <button class="btn" type="submit">Сохранить</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar}"></nav>
</body>
</html>
