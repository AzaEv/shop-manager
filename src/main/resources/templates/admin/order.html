<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="container narrow">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <p><a class="back" href="/admin/orders">← К заказам</a></p>
        <div class="panel">
            <div class="section-head">
                <h1 th:text="'Заказ № ' + ${order.id}"></h1>
                <span class="status" th:classappend="${'status-' + order.status}" th:text="${order.status.title}"></span>
            </div>
            <p th:text="${order.customer.name} + ' · ' + ${order.customer.email}"></p>
            <p th:text="'Адрес: ' + ${order.address}"></p>
            <p class="muted" th:text="${@ui.when(order.createdAt)}"></p>
            <form class="inline-form" th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                <select name="status">
                    <option th:each="st : ${statuses}"
                            th:value="${st}"
                            th:text="${st.title}"
                            th:selected="${st == order.status}"
                            th:disabled="${st != order.status and !order.status.canTransitionTo(st)}"></option>
                </select>
                <button class="btn" type="submit">Сменить статус</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th>Товар</th><th>SKU</th><th>Цена</th><th>Кол-во</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.productName}"></td>
                        <td th:text="${item.sku}"></td>
                        <td th:text="${@ui.rub(item.unitPrice)}"></td>
                        <td th:text="${item.quantity}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="price-xl" th:text="${@ui.rub(order.total)}"></p>
            <h2>История</h2>
            <ol class="timeline">
                <li th:each="entry : ${order.history}">
                    <strong th:text="${(entry.fromStatus != null ? entry.fromStatus.title : '—') + ' → ' + entry.toStatus.title}"></strong>
                    <p class="muted" th:text="${@ui.when(entry.changedAt)}"></p>
                </li>
            </ol>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar}"></nav>
</body>
</html>
