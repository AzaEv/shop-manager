<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="container">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <nav th:replace="~{fragments/layout :: adminNav('products')}"></nav>
        <div class="section-head">
            <h1>Товары</h1>
            <a class="btn" href="/admin/products/new">Новый товар</a>
        </div>
        <form class="toolbar" method="get" th:action="@{/admin/products}">
            <input type="search" name="q" placeholder="Поиск товара" th:value="${q}">
            <select name="categoryId">
                <option value="">Все категории</option>
                <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"
                        th:selected="${selectedCategoryId == category.id}"></option>
            </select>
            <select name="sort">
                <option value="NAME" th:selected="${sort == 'NAME'}">Название</option>
                <option value="PRICE" th:selected="${sort == 'PRICE'}">Цена</option>
                <option value="STOCK" th:selected="${sort == 'STOCK'}">Остаток</option>
            </select>
            <select name="dir">
                <option value="asc" th:selected="${dir == 'asc'}">Возрастание</option>
                <option value="desc" th:selected="${dir == 'desc'}">Убывание</option>
            </select>
            <button class="btn" type="submit">Применить</button>
        </form>
        <form class="inline-form panel" th:action="@{/admin/categories}" method="post" style="margin-bottom: 12px;">
            <input name="name" placeholder="Новая категория" required>
            <input name="slug" placeholder="slug" required>
            <button class="btn" type="submit">Добавить</button>
        </form>
        <div class="cat-admin">
            <form th:each="category : ${categories}" th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post">
                <span th:text="${category.name}"></span>
                <button type="submit" class="btn ghost sm" onclick="return confirm('Удалить категорию, если в ней нет товаров?')">Удалить</button>
            </form>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>SKU</th><th>Название</th><th>Категория</th><th>Цена</th><th>Остаток</th><th>Активен</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.sku}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.category.name}"></td>
                    <td th:text="${@ui.rub(product.price)}"></td>
                    <td th:text="${product.stock}"></td>
                    <td th:text="${product.active} ? 'да' : 'нет'"></td>
                    <td class="actions">
                        <a th:href="@{/admin/products/{id}/edit(id=${product.id})}">Изменить</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
                            <button type="submit" class="btn ghost sm" onclick="return confirm('Удалить товар?')">Удалить</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar}"></nav>
</body>
</html>
