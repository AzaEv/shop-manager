<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p><a href="/orders">← К заказам</a></p>
    <h1 th:text="'Заказ №' + ${order.id}"></h1>
    <p>Статус: <span class="status" th:text="${order.status}"></span></p>
    <p th:text="'Адрес: ' + ${order.address}"></p>
    <table>
        <thead>
        <tr><th>Товар</th><th>SKU</th><th>Цена</th><th>Кол-во</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}"></td>
            <td th:text="${item.sku}"></td>
            <td th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></td>
            <td th:text="${item.quantity}"></td>
        </tr>
        </tbody>
    </table>
    <p class="price" th:text="'Итого: ' + ${#numbers.formatDecimal(order.total, 1, 2)} + ' ₽'"></p>
    <h2>История статусов</h2>
    <ul>
        <li th:each="h : ${order.history}"
            th:text="${(h.fromStatus != null ? h.fromStatus : '—')} + ' → ' + ${h.toStatus} + ' · ' + ${#temporals.format(h.changedAt, 'dd.MM.yyyy HH:mm')}"></li>
    </ul>
</main>
</body>
</html>
