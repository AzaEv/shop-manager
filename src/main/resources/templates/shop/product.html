<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="container">
        <div th:replace="~{fragments/layout :: flash}"></div>
        <p class="crumbs">
            <a href="/">Главная</a>
            <span>/</span>
            <a th:href="@{/(categoryId=${product.category.id})}" th:text="${product.category.name}">Категория</a>
            <span>/</span>
            <span th:text="${product.name}">Товар</span>
        </p>
        <section class="product">
            <div class="art lg" th:classappend="${'tone-' + @ui.tone(product.category.slug)}">
                <img th:if="${@ui.photo(product.sku) != null}" th:src="@{${@ui.photo(product.sku)}}" th:alt="${product.name}">
                <span th:if="${@ui.photo(product.sku) == null}" th:text="${@ui.emoji(product.category.slug)}">🛍️</span>
            </div>
            <div class="buybox">
                <p class="sku" th:text="${product.category.name} + ' · ' + ${product.sku}"></p>
                <h1 th:text="${product.name}">Товар</h1>
                <p th:text="${product.description}"></p>
                <p class="price-xl" th:text="${@ui.rub(product.price)}">0 ₽</p>
                <div class="installment" th:if="${product.price != null}">
                    <p class="muted">12 платежей без наценки</p>
                    <strong th:text="'от ' + ${@ui.monthly(product.price)} + ' / мес'"></strong>
                    <p class="tiny muted">Это та же цена, разделённая на 12. Отдельный кредит не открывается.</p>
                </div>
                <p th:if="${product.stock > 0}" th:text="'В наличии: ' + ${product.stock} + ' шт.'"></p>
                <p class="low" th:if="${product.stock < 1 or !product.active}">Сейчас нет в наличии</p>
                <form class="buy" th:if="${product.active and product.stock > 0}" sec:authorize="hasRole('CUSTOMER')"
                      th:action="@{/cart/items}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <div class="stepper" data-stepper>
                        <button type="button" data-step="-1" aria-label="Меньше">−</button>
                        <input type="number" name="quantity" min="1" th:max="${product.stock}" value="1" aria-label="Количество">
                        <button type="button" data-step="1" aria-label="Больше">+</button>
                    </div>
                    <button class="btn full" type="submit">В корзину</button>
                </form>
                <a class="btn full" href="/login" sec:authorize="!isAuthenticated()"
                   th:if="${product.active and product.stock > 0}">Войти, чтобы купить</a>
                <p class="muted" sec:authorize="isAuthenticated() and !hasRole('CUSTOMER')">Покупка доступна только покупателям</p>
            </div>
        </section>

        <section th:if="${!#lists.isEmpty(related)}" style="margin-top: 36px;">
            <div class="section-head"><h2>Похожие товары</h2></div>
            <div class="grid">
                <th:block th:each="item, stat : ${related}">
                    <article th:replace="~{fragments/product-card :: card(product=${item}, index=${stat.index})}"></article>
                </th:block>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar}"></nav>
</body>
</html>
