<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>Каталог</h1>
    <form class="search-bar" method="get" action="/">
        <input type="hidden" name="categoryId" th:if="${selectedCategoryId != null}" th:value="${selectedCategoryId}">
        <input type="search" name="q" placeholder="Поиск по названию, SKU, описанию" th:value="${q}">
        <select name="sort">
            <option value="NAME" th:selected="${sort == 'NAME'}">По названию</option>
            <option value="PRICE" th:selected="${sort == 'PRICE'}">По цене</option>
            <option value="STOCK" th:selected="${sort == 'STOCK'}">По остатку</option>
        </select>
        <select name="dir">
            <option value="asc" th:selected="${dir == 'asc'}">Возрастание</option>
            <option value="desc" th:selected="${dir == 'desc'}">Убывание</option>
        </select>
        <button type="submit">Найти</button>
    </form>
    <div class="filters">
        <a th:classappend="${selectedCategoryId == null} ? ' active'"
           th:href="@{/(q=${q}, sort=${sort}, dir=${dir})}">Все</a>
        <a th:each="category : ${categories}"
           th:href="@{/(categoryId=${category.id}, q=${q}, sort=${sort}, dir=${dir})}"
           th:text="${category.name}"
           th:classappend="${selectedCategoryId == category.id} ? ' active'"></a>
    </div>
    <section class="grid">
        <article class="card" th:each="product : ${products}">
            <h2><a th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Товар</a></h2>
            <p class="muted" th:text="${product.category.name}">Категория</p>
            <p class="price" th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' ₽'">0</p>
            <p class="muted" th:text="'В наличии: ' + ${product.stock}"></p>
            <form th:action="@{/cart/items}" method="post" sec:authorize="isAuthenticated()">
                <input type="hidden" name="productId" th:value="${product.id}">
                <input type="hidden" name="quantity" value="1">
                <button type="submit">В корзину</button>
            </form>
            <a class="ghost" href="/login" sec:authorize="!isAuthenticated()">Войдите, чтобы купить</a>
        </article>
    </section>
    <p th:if="${#lists.isEmpty(products)}" class="muted">Ничего не найдено. Измените запрос или фильтр.</p>
</main>
</body>
</html>
