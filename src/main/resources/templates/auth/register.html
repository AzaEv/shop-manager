<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page">
    <div class="container auth-grid">
        <aside class="auth-aside">
            <p class="kicker">новый аккаунт</p>
            <h1>Покупайте как дома</h1>
            <p>После регистрации сразу откроется каталог. Имя, телефон и адрес можно поправить в профиле.</p>
            <span class="blob a"></span>
            <span class="blob b"></span>
        </aside>
        <form class="panel" th:action="@{/register}" method="post">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <h2>Регистрация</h2>
            <label class="field">Имя
                <input type="text" name="name" required maxlength="180" autocomplete="name">
            </label>
            <label class="field">Email
                <input type="email" name="email" required autocomplete="email">
            </label>
            <label class="field">Телефон
                <input type="tel" name="phone" maxlength="40" autocomplete="tel">
            </label>
            <label class="field">Пароль
                <input type="password" name="password" required minlength="6" autocomplete="new-password">
            </label>
            <button class="btn full" type="submit">Создать аккаунт</button>
            <p style="margin-top: 14px;">Уже есть аккаунт? <a href="/login"><strong>Войти</strong></a></p>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<nav th:replace="~{fragments/layout :: tabbar}"></nav>
</body>
</html>
