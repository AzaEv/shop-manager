<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="wrap narrow">
    <h1>Вход</h1>
    <p class="flash err" th:if="${param.error}">Неверный email или пароль</p>
    <form th:action="@{/login}" method="post">
        <label>Email
            <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>Пароль
            <input type="password" name="password" required>
        </label>
        <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="/register">Регистрация</a></p>
    <p class="muted">Покупатель: customer@shop.local / customer123<br>
        Менеджер: manager@shop.local / manager123<br>
        Кладовщик: warehouse@shop.local / warehouse123<br>
        Администратор: admin@shop.local / admin123</p>
</main>
</body>
</html>
